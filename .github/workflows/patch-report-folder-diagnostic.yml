name: Patch report folder diagnostic
on:
  push:
    paths:
      - '.github/workflows/patch-report-folder-diagnostic.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch report folder lookup only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=''' const q=encodeURIComponent("'"+MS365.reportFolderName+"'");
           const found=await graphJson('https://graph.microsoft.com/v1.0/drives/'+drive.id+'/root/search(q='+q+')?$select=id,name,folder,parentReference',token,'Report folder lookup');
           const folders=(found.value||[]).filter(x=>x.folder&&norm(x.name).toLowerCase()===MS365.reportFolderName.toLowerCase());
           if(!folders.length)throw new Error('Folder "'+MS365.reportFolderName+'" was not found in SharePoint.');
           if(folders.length>1)throw new Error('More than one "'+MS365.reportFolderName+'" folder was found. Please use a unique report folder name.');
           return{drive,folder:folders[0]};'''
          new=''' const q=encodeURIComponent("'"+MS365.reportFolderName+"'");
           const found=await graphJson('https://graph.microsoft.com/v1.0/drives/'+drive.id+'/root/search(q='+q+')?$select=id,name,folder,parentReference,webUrl',token,'Report folder lookup');
           const folders=(found.value||[]).filter(x=>x.folder&&norm(x.name).toLowerCase()===MS365.reportFolderName.toLowerCase());
           if(!folders.length){
            const root=await graphJson('https://graph.microsoft.com/v1.0/drives/'+drive.id+'/root/children?$select=id,name,folder,webUrl&$top=200',token,'Report archive diagnostic');
            const items=(root.value||[]).map(x=>(x.folder?'[folder] ':'[file] ')+x.name).slice(0,50);
            const driveNames=(drives.value||[]).map(d=>d.name).join(', ');
            throw new Error('Folder "'+MS365.reportFolderName+'" was not found in document library "'+drive.name+'". Available libraries: '+driveNames+'. Root items in "'+drive.name+'": '+(items.length?items.join(', '):'none returned')+'.');
           }
           if(folders.length>1){
            const locations=folders.map(x=>x.webUrl||x.parentReference?.path||x.name).join(' | ');
            throw new Error('More than one "'+MS365.reportFolderName+'" folder was found. Locations: '+locations);
           }
           return{drive,folder:folders[0]};'''
          if old not in s:
              raise SystemExit('Expected report-folder lookup block was not found; index.html left unchanged.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-report-folder-diagnostic.yml
          git add index.html
          git commit -m 'Expose SharePoint report folder hierarchy for diagnostics'
          git push origin HEAD:main
