name: Deploy Allocation Range Checks

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply allocation reconciliation patch
        run: python tools/patch_reconciliation.py

      - name: Apply Wealth runtime fix
        run: python - <<'PY'
          from pathlib import Path
          p = Path('wealth.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="wealth_runtime_fix.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '\n</body>')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
