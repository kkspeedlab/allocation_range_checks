<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allocation Range Pre-Trade Check — SpeedLab Sign-in</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<style>
:root{--navy:#17324d;--blue:#2f6fa3;--bg:#f4f6f9;--text:#243444;--muted:#6c7a89;--border:#dfe5eb;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center}.gate{width:min(520px,calc(100% - 32px));background:#fff;border:1px solid var(--border);border-radius:12px;padding:30px;box-shadow:0 12px 36px #17324d18}.brand{color:var(--navy);font-size:22px;font-weight:700;margin-bottom:7px}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:24px}.btn{width:100%;border:0;border-radius:7px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn:disabled{opacity:.6;cursor:wait}.status{margin-top:15px;font-size:12px;color:var(--muted);line-height:1.45}.error{color:var(--red)}
</style>
</head>
<body>
<div class="gate">
 <div class="brand">Allocation Range Pre-Trade Check</div>
 <div class="sub">SpeedLab internal application. Sign in with your SpeedLab Microsoft account to continue.</div>
 <button id="signin" class="btn" type="button">Sign in with Microsoft</button>
 <div id="status" class="status">Authentication is required before the application is loaded.</div>
</div>
<script>
const CLIENT_ID='ba7b47bc-1bb2-403d-9eb3-01f8f1b7eb0c';
const TENANT_ID='572dc356-734c-4a91-9e41-33f2e8e48071';
const REDIRECT_URI='https://kkspeedlab.github.io/allocation_range_checks/';
const statusEl=document.getElementById('status');
const signInBtn=document.getElementById('signin');
let loadingApp=false;
const authApp=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:'https://login.microsoftonline.com/'+TENANT_ID,redirectUri:REDIRECT_URI},cache:{cacheLocation:'sessionStorage'}});
function setStatus(message,isError=false){statusEl.textContent=message;statusEl.className='status'+(isError?' error':'')}
async function loadProtectedApp(account){
 if(loadingApp)return;loadingApp=true;signInBtn.disabled=true;
 try{
  if(!account||account.tenantId!==TENANT_ID)throw new Error('This application is restricted to the SpeedLab Microsoft tenant.');
  setStatus('Authenticated as '+(account.username||account.name||'SpeedLab user')+'. Loading application…');
  const response=await fetch('app.payload.txt',{cache:'no-store'});
  if(!response.ok)throw new Error('Application payload could not be loaded ('+response.status+').');
  const html=await response.text();
  document.open();document.write(html);document.close();
 }catch(e){loadingApp=false;signInBtn.disabled=false;setStatus(e?.message||String(e),true)}
}
async function signIn(){
 signInBtn.disabled=true;setStatus('Opening Microsoft sign-in…');
 try{
  const result=await authApp.loginPopup({scopes:['User.Read'],prompt:'select_account'});
  await loadProtectedApp(result.account);
 }catch(e){signInBtn.disabled=false;setStatus('Sign-in was not completed: '+(e?.message||e),true)}
}
(async()=>{
 try{
  await authApp.initialize();
  const redirectResult=await authApp.handleRedirectPromise();
  const account=redirectResult?.account||authApp.getAllAccounts().find(a=>a.tenantId===TENANT_ID);
  if(account)await loadProtectedApp(account);
 }catch(e){setStatus('Authentication initialization failed: '+(e?.message||e),true)}
})();
signInBtn.addEventListener('click',signIn);
</script>
</body>
</html>
